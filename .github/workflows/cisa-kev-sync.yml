name: cisa-kev-sync
# Refresh data/cisa-kev.txt from the CISA Known Exploited Vulnerabilities feed
# and regenerate CATALOG.md so the derived KEV column stays current. A target is
# "KEV" when any CVE in its vuln_refs is on the catalog — nothing is written into
# the contracts; KEV is derived, and only the shared CVE-id snapshot moves.
#
# main is a protected branch, so this opens (and rolls forward) a pull request
# instead of pushing directly. For the PR's required status checks to run — and
# therefore be mergeable — set an AUTOMATION_PAT secret (a token that can trigger
# workflows; the default GITHUB_TOKEN deliberately cannot). Without it the PR is
# still opened, but its checks must be kicked manually (e.g. close/reopen).
on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cisa-kev-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: refresh the KEV CVE snapshot from CISA
        run: python3 scripts/fetch_kev.py
      - name: regenerate CATALOG with the updated KEV column
        run: python3 scripts/gen_catalog.py
      - name: read the catalog version for the PR title
        id: kev
        run: |
          echo "version=$(sed -n 's/^# catalogVersion: \([^ ]*\).*/\1/p' data/cisa-kev.txt)" >> "$GITHUB_OUTPUT"
      - name: open or update a PR when the snapshot or catalog changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AUTOMATION_PAT || github.token }}
          add-paths: |
            data/cisa-kev.txt
            CATALOG.md
          branch: automation/cisa-kev-sync
          delete-branch: true
          commit-message: "chore(kev): sync CISA KEV catalog (version ${{ steps.kev.outputs.version }})"
          title: "chore(kev): sync CISA KEV catalog (version ${{ steps.kev.outputs.version }})"
          labels: automation
          body: |
            Automated refresh of `data/cisa-kev.txt` from the CISA Known Exploited
            Vulnerabilities feed, with `CATALOG.md` regenerated so the derived KEV
            column stays current.

            KEV status is derived from this snapshot — no contract files change.
            Opened and rolled forward by the `cisa-kev-sync` workflow.
