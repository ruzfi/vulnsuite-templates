name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  vulnsuite-validate:
    runs-on: ubuntu-latest
    env:
      # Read-only PAT with access to the private vulnsuite repo. Unset it once
      # vulnsuite is public: the fetch then needs no auth and the configure
      # step below is skipped -- no workflow edit needed when visibility flips.
      VULNSUITE_RO: ${{ secrets.VULNSUITE_RO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: authenticate the private vulnsuite module (only while private)
        if: env.VULNSUITE_RO != ''
        run: |
          echo "GOPRIVATE=github.com/ruzfi/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${VULNSUITE_RO}@github.com/".insteadOf "https://github.com/"
      - name: install vulnsuite
        run: go install github.com/ruzfi/vulnsuite/cmd/vulnsuite@main
      - name: validate every template
        # -allow-unpinned until every base carries a digest; drop it to enforce pinning.
        # No-op while the repo ships docs + schema only (no contract.yaml present).
        run: |
          if ! find . -name contract.yaml -not -path './.git/*' | grep -q .; then
            echo "No templates present; skipping vulnsuite validate."
            exit 0
          fi
          vulnsuite -templates . validate -allow-unpinned
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install check-jsonschema
      - name: check contracts against the JSON schema
        # No-op while the repo ships docs + schema only (no contract.yaml present).
        run: |
          if ! find . -name contract.yaml -not -path './.git/*' | grep -q .; then
            echo "No templates present; skipping schema validation."
            exit 0
          fi
          find . -name contract.yaml -not -path './.git/*' -print0 \
            | xargs -0 check-jsonschema --schemafile schemas/contract.schema.json
  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@v1.4.2
