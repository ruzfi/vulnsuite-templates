apiVersion: vulnsuite/v1
kind: Target
metadata:
  id: spring-boot-actuator-env-exposure
  summary: >-
    Spring Boot Actuator exposes only /health and /info over HTTP by default,
    but setting management.endpoints.web.exposure.include=* publishes
    /actuator/env, which leaks the application's configuration and environment
    (CWE-200). Verified benignly by detecting the env endpoint's structure, not
    by reading secret values.
  cwe: [CWE-200]
  severity: medium
  tags: [spring-boot, actuator, java, info-disclosure, misconfiguration, config-axis]
  references:
    - https://docs.spring.io/spring-boot/docs/2.7.x/reference/html/actuator.html#actuator.endpoints.exposing
    - https://cwe.mitre.org/data/definitions/200.html
  maintainer: ruzfi
  added: "2026-10-14"
  # Config-axis target: the SAME built image in both states, differing only by
  # the MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE env var. The detector is the
  # upstream Nuclei actuator template; declared from its fingerprint, pending a
  # run against both states.
  fidelity: real
  detected_by: ["nuclei:springboot-actuator"]

base:
  kind: build
  context: build
  dockerfile: Dockerfile

service:
  ports: [ { container: 8080, protocol: http } ]
  healthcheck:
    # /actuator/health is exposed by default in both states.
    http: { path: /actuator/health, status: 200 }
    timeout: 180s

states:
  vulnerable:
    # Over-expose every actuator endpoint, including /env.
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
    verify:
      - http:
          method: GET
          path: "/actuator/env"
          status: 200
          body_matches: '"propertySources"'
  # "patched" is the secure default: only health/info exposed, so /env is not
  # reachable. The fix for this class is the exposure config, not a version bump.
  patched:
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
    verify:
      - http:
          method: GET
          path: "/actuator/env"
          status_in: [404, 400]
          body_absent: '"propertySources"'
