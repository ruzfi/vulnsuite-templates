apiVersion: vulnsuite/v1
kind: Target
metadata:
  id: php-fpm-status-exposure
  summary: >-
    PHP-FPM does not expose its pool status page by default, but setting
    pm.status_path and routing it through the web server publishes pool
    internals (active processes, request URIs, scripts) to anyone (CWE-200).
    Verified benignly by reading the probe's own request URI back out of the
    full per-process status.
  vuln_refs: [VS-EXPOSED-PHPFPM-STATUS]
  cwe: [CWE-200]
  severity: low
  class: [exposure]
  tags: [php, php-fpm, nginx, status, info-disclosure, misconfiguration, config-axis]
  references:
    - https://www.php.net/manual/en/fpm.status.php
    - https://cwe.mitre.org/data/definitions/200.html
  maintainer: ruzfi
  added: "2026-10-14"
  updated: "2026-11-21"
  fidelity: real
  detection: scanner
  detected_by: ["nuclei:php-fpm-status"]
  verified_on:
    date: "2026-11-21"
    vulnsuite: v0.5.0
    host: linux/arm64
    states: [vulnerable, patched]

base:
  kind: build
  context: build
  dockerfile: Dockerfile

service:
  ports: [ { container: 80, protocol: http } ]
  healthcheck:
    http: { path: /, status: 200 }
    timeout: 90s

states:
  vulnerable:
    environment:
      FPM_STATUS: "1"
    verify:
      - http:
          method: GET
          path: "/status?json&full&vs=7f3a9c"
          status: 200
          body_matches: '(?s)"process manager":"dynamic".*"request uri":"\\/status\?json&full&vs=7f3a9c"'
  patched:
    environment:
      FPM_STATUS: "0"
    verify:
      - http:
          method: GET
          path: "/status?json&full&vs=7f3a9c"
          status: 404
          body_matches: "File not found"
          body_absent: "process manager"
