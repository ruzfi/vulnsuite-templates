server {
    listen 80;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pass the PHP-FPM status path through to FPM. FPM only answers it when
    # pm.status_path is configured (see entrypoint.sh / FPM_STATUS).
    location = /status {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /status;
        fastcgi_param SCRIPT_FILENAME /status;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
