apiVersion: vulnsuite/v1
kind: Target
metadata:
  id: flask-werkzeug-debugger
  summary: >-
    A Flask app is safe by default, but running it with debug enabled exposes
    the Werkzeug interactive debugger: any unhandled error returns a traceback
    page with an (RCE-capable) console (CWE-489). Verified benignly by reaching
    the (PIN-locked) /console page and the debugger's own resources, never by
    executing code in the console.
  vuln_refs: [VS-MISCONF-FLASK-DEBUG]
  cwe: [CWE-489]
  severity: high
  class: [misconfig]
  tags: [flask, werkzeug, python, debug, misconfiguration, rce, config-axis]
  references:
    - https://werkzeug.palletsprojects.com/en/stable/debug/
    - https://cwe.mitre.org/data/definitions/489.html
    - https://owasp.org/www-community/vulnerabilities/Improper_Error_Handling
  maintainer: ruzfi
  added: "2026-10-14"
  updated: "2026-11-21"
  fidelity: real
  detection: scanner
  detected_by: ["nuclei:flask-werkzeug-debug"]
  verified_on:
    date: "2026-11-21"
    vulnsuite: v0.5.0
    host: linux/arm64
    states: [vulnerable, patched]

base:
  kind: build
  context: build
  dockerfile: Dockerfile

service:
  ports: [ { container: 5000, protocol: http } ]
  healthcheck:
    http: { path: /healthz, status: 200 }
    timeout: 60s

states:
  vulnerable:
    environment:
      APP_DEBUG: "1"
    verify:
      - http:
          method: GET
          path: "/console"
          status: 200
          body_matches: "(?s)CONSOLE_MODE = true.*EVALEX = true"
      - http:
          method: GET
          path: "/?__debugger__=yes&cmd=resource&f=debugger.js"
          status: 200
          header_matches: { Content-Type: "javascript" }
          body_matches: "createInteractiveConsole"
  patched:
    environment:
      APP_DEBUG: "0"
    verify:
      - http:
          method: GET
          path: "/console"
          status: 404
          body_matches: "The requested URL was not found on the server"
          body_absent: "EVALEX"
      - http:
          method: GET
          path: "/?__debugger__=yes&cmd=resource&f=debugger.js"
          status: 500
          body_matches: "The server encountered an internal error"
          body_absent: "createInteractiveConsole"
