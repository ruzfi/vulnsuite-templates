apiVersion: vulnsuite/v1
kind: Target

metadata:
  id: mastodon-4.7.5-ghsa-34m4-m9fh-gqp5
  summary: >-
    Mastodon 4.7.5's official image bundles Ruby 4.0.9, whose case mapping
    writes one byte past a heap buffer when it upcases the sharp s (0xDF) in an
    ISO-8859-x or Windows-125x string ("Ruby2Shell"). Mastodon reaches it
    without authentication through Rails' Rack::MethodOverride, which upcases a
    multipart _method field whose part declares a legacy charset. The vendor
    image runs behind nginx; 4.7.6 ships the fixed Ruby 4.0.10.
  vuln_refs: [GHSA-34m4-m9fh-gqp5]
  cwe: [CWE-193, CWE-122]
  severity: critical
  class: [vuln]
  group: ruby2shell
  variant: mastodon-4-7
  tags: [mastodon, ruby, rails, rack, puma, heap-overflow, memory-corruption, rce, ruby2shell, real, version, needs-db]
  references:
    - https://github.com/ruby/ruby/security/advisories/GHSA-34m4-m9fh-gqp5
    - https://github.com/mastodon/mastodon/releases/tag/v4.7.6
    - https://github.com/ruby/ruby/pull/20005
    - https://verialabs.com/ruby2shell/
  maintainer: ruzfi
  added: "2026-11-19"
  disclosed: "2026-11-19"
  fidelity: real
  detected_by: ["nuclei:ruby2shell-casemap-overflow"]

base:
  kind: build
  context: src
  dockerfile: Dockerfile

service:
  ports:
    - { container: 8080, protocol: http }
  environment:
    RAILS_ENV: production
    LOCAL_DOMAIN: mastodon.vulnsuite.test
    DB_HOST: db
    DB_USER: mastodon
    DB_PASS: mastodon
    DB_NAME: mastodon
    REDIS_HOST: redis
    SECRET_KEY_BASE: 46fdfdf0d6c9b32ef1def333d7844d8cfc4cf232491532a12a48ec33511a25519152831c7423c24455cfa0054367c8b0170155f92fbecd1a63d56f54ec0c42a4
    OTP_SECRET: e9bb4e03c3f432c929818ff3c749656b738a1ec8009dadbc8dc01d877f69cbd54deb52acba2bb6500064a5cd99c9373f7dd2f51d8c81b176b9fff76180adb3e1
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: 8d9a3c9f042794beabba01d7b243117c
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: 0f1e525ba19b7668d22405dc362008d3
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: 02ccbff3525f409606ebe4a3e093a87b
  sidecars:
    - name: db
      image: postgres:17-alpine
      digest: sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
      environment:
        POSTGRES_USER: mastodon
        POSTGRES_PASSWORD: mastodon
    - name: redis
      image: redis:7-alpine
      digest: sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
  healthcheck:
    http: { path: /health, status: 200 }
    timeout: 300s

states:
  vulnerable:
    verify:
      - exec:
          run: "/usr/local/bin/verify-ruby2shell --expect-vulnerable"
          expect_exit: 0
          stdout_matches: 'PASS vulnerable: case-map heap buffer overflowed by an unauthenticated request; glibc=malloc\w*: memory corruption; frame=mapping_buffer_free.*sink=rack/method_override\.rb:\d+; response=none\(\w+\); worker=respawned'
          timeout: 90
  patched:
    overlay:
      - { src: files/patched/Dockerfile, dest: Dockerfile }
    verify:
      - exec:
          run: "/usr/local/bin/verify-ruby2shell --expect-patched"
          expect_exit: 0
          stdout_matches: 'PASS patched: same request handled without heap corruption; glibc=clean; response=404'
          timeout: 90
