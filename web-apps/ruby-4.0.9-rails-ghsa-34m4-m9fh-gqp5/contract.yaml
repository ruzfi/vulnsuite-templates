apiVersion: vulnsuite/v1
kind: Target

metadata:
  id: ruby-4.0.9-rails-ghsa-34m4-m9fh-gqp5
  summary: >-
    Ruby 4.0.0-4.0.9 writes one byte past a heap buffer when it upcases the
    sharp s (0xDF) in an ISO-8859-x or Windows-125x string ("Ruby2Shell").
    Stock Rails reaches it without authentication: Rack::MethodOverride upcases
    a multipart _method field whose part declares a legacy charset. A real
    Rails 8.1 app on Puma behind Thruster runs on the affected (4.0.9) or the
    fixed (4.0.10) Ruby.
  vuln_refs: [GHSA-34m4-m9fh-gqp5]
  cwe: [CWE-193, CWE-122]
  severity: critical
  class: [vuln]
  group: ruby2shell
  primary: true
  variant: ruby-4-0
  tags: [ruby, runtime, rails, rack, puma, heap-overflow, memory-corruption, rce, ruby2shell, real, version]
  references:
    - https://github.com/ruby/ruby/security/advisories/GHSA-34m4-m9fh-gqp5
    - https://github.com/ruby/ruby/commit/d582f8f
    - https://github.com/ruby/ruby/pull/20005
    - https://github.com/ruby/ruby/releases/tag/v4.0.10
    - https://verialabs.com/ruby2shell/
  maintainer: ruzfi
  added: "2026-11-19"
  disclosed: "2026-11-19"
  fidelity: real
  detected_by: ["nuclei:ruby2shell-casemap-overflow"]

base:
  kind: build
  context: src
  dockerfile: Dockerfile

service:
  ports:
    - { container: 80, protocol: http }
  healthcheck:
    http: { path: /up, status: 200 }
    timeout: 120s

states:
  vulnerable:
    verify:
      - exec:
          run: "/rails/bin/verify-ruby2shell --expect-vulnerable"
          expect_exit: 0
          stdout_matches: 'PASS vulnerable: case-map heap buffer overflowed by an unauthenticated request; glibc=malloc\w*: memory corruption; frame=mapping_buffer_free.*sink=rack/method_override\.rb:\d+; response=none\(\w+\); worker=respawned'
          timeout: 60
  patched:
    overlay:
      - { src: files/patched/Dockerfile, dest: Dockerfile }
    verify:
      - exec:
          run: "/rails/bin/verify-ruby2shell --expect-patched"
          expect_exit: 0
          stdout_matches: 'PASS patched: same request handled without heap corruption; glibc=clean; response=404'
          timeout: 60
