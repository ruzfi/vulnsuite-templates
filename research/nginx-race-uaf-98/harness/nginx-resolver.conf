worker_processes 1;
error_log /var/log/asan/error.log info;
events { worker_connections 1024; }
http {
    access_log off;
    resolver dns:53 ipv6=off valid=1s;
    resolver_timeout 30s;
    server {
        listen 80;
        location / {
            mirror /m;                 # background subrequest, same name
            mirror_request_body off;   # mirror starts (and resolves) before the body is complete
            proxy_pass http://$arg_h;
        }
        location = /m {
            internal;
            proxy_pass http://$arg_h;
        }
    }
}
